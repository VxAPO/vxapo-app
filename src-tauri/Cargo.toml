[package]
name = "vxapo-app"
version = "0.1.0"
edition = "2021"
description = "VxAPO desktop application"
license = "GPL-3.0-or-later"

[lib]
name = "vxapo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 发布构建：更小体积与更快冷启动（代价是构建时间变长）
[profile.release]
lto = true
codegen-units = 1
strip = true
