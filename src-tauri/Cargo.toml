[package]
name = "vxapo-app"
version = "0.1.0"
edition = "2021"
description = "VxAPO desktop application"
license = "GPL-3.0-or-later"

[lib]
name = "vxapo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 发布构建：性能优先，但不让 LTO 拖慢编译。
# lto = "thin"：与 fat LTO 的运行性能差距通常 <2%，编译时间却快数倍；
# codegen-units = 16（Cargo 默认）：设成 1 只多约 1% 性能，编译却慢好几倍。
# 注意：改这个 profile 会让下一次构建整图重编（一次性代价），之后增量构建才快。
[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
strip = true
